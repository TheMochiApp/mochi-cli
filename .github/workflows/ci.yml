name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify native Windows Credential Manager round trip
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-keyring.mjs
      - name: Run formatting, lint, typecheck, tests, and build
        run: npm run ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify publishable package contents
        run: node scripts/verify-package.mjs
