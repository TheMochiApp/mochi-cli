name: Mochi skill live docs

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mochi-skill-live-docs
  cancel-in-progress: false

jobs:
  public-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOCHI_SKILL_SOURCE: https://github.com/TheMochiApp/mochi-cli.git
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify public GitHub skill installation
        run: npm run verify:skill-install

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify public documentation discovery
        run: npm run check:live-docs
